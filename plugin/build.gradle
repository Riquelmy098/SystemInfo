plugins {
    id 'com.android.library' version '8.8.0'
}

android {
    namespace 'com.plugin.systeminfo'
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'org.godotengine:godot:4.7.1.stable'
}
