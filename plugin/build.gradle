plugins {
    id 'com.android.library' version '8.8.0'
}

android {
    namespace 'com.plugin.systeminfo'
    compileSdk 35

    defaultConfig {
        minSdk 24 // Atualizado de 21 para 24 para compatibilidade com Godot 4 e Material Components
        targetSdk 35
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    compileOnly 'org.godotengine:godot:4.7.1.stable'
    implementation 'com.google.android.material:material:1.14.0'
}
